<div class="w-full flex items-center justify-center py-6 sm:py-12 px-4">
<!-- Centered Login Card -->
<div class="w-full max-w-[420px] bg-surface rounded-[20px] p-6 sm:p-8 shadow-sm flex flex-col border border-outline">
<a href="./s1_beranda.html" class="inline-flex items-center gap-1 text-caption font-caption text-on-surface-muted hover:text-primary transition-colors mb-4 self-start font-medium">
<span class="material-symbols-outlined text-[16px]">arrow_back</span>
<span>Kembali ke Beranda</span>
</a>
<!-- Brand Header -->
<div class="flex flex-col items-center text-center">
<!-- ShareFood Organic Leaf/Share Symbol -->
<div class="w-12 h-12 rounded-xl bg-badge-bg flex items-center justify-center text-success mb-2">
<svg class="w-7 h-7" fill="none" viewbox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">

<path d="M12.5 14C12.5 10.4101 15.4101 7.5 19 7.5C19.8284 7.5 20.5 8.17157 20.5 9C20.5 12.5899 17.5899 15.5 14 15.5C13.1716 15.5 12.5 14.8284 12.5 14Z" fill="currentColor"></path>
<circle cx="10" cy="11" fill="currentColor" r="2"></circle>
</svg>
</div>
<h1 class="font-headline-lg text-2xl sm:text-headline-lg text-scrim mt-2 font-bold">
          Selamat Datang Kembali
        </h1>
<p class="font-body-md text-body-md text-on-surface-muted mt-1.5 mb-6 text-center leading-relaxed">
          Masuk ke akun ShareFood Anda untuk berbagi atau mengambil makanan.
        </p>
</div>
<!-- Sign In Form -->
<form class="space-y-4" id="loginForm" onsubmit="event.preventDefault(); window.location.href='./s11_dashboard_ringkasan_dashboard.html';">
<!-- Email Input -->
<div class="flex flex-col space-y-1.5">
<label class="font-label-md text-label-md text-on-surface" for="email">
            Email
          </label>
<div class="relative">
<input class="w-full bg-background rounded-xl px-3.5 py-3 font-body-md text-body-md text-on-surface placeholder-on-surface-muted/60 transition-colors focus:bg-surface focus:outline-none focus:ring-2 focus:ring-primary-container" id="email" name="email" placeholder="nama@email.com" required="" type="email" value="budi.santoso@email.com"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col space-y-1.5">
<label class="font-label-md text-label-md text-on-surface" for="password">
            Password
          </label>
<div class="relative flex items-center">
<input class="w-full bg-background rounded-xl pl-3.5 pr-11 py-3 font-body-md text-body-md text-on-surface placeholder-on-surface-muted/60 transition-colors focus:bg-surface focus:outline-none focus:ring-2 focus:ring-primary-container" id="password" name="password" placeholder="••••••••" required="" type="password" value="rahasia123"/>
<button aria-label="Tampilkan atau sembunyikan kata sandi" class="absolute right-3 text-on-surface-muted hover:text-on-surface flex items-center justify-center p-1 rounded-lg transition-colors focus:outline-none" id="togglePasswordBtn" type="button">
<span class="material-symbols-outlined text-[20px]" id="passwordEyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me & Forgot Password Row -->
<div class="flex items-center justify-between pt-1">
<label class="flex items-center space-x-2 cursor-pointer select-none">
<input checked="" class="w-4 h-4 rounded text-primary-container accent-primary-container focus:ring-primary-container cursor-pointer" id="remember" name="remember" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface">Ingat saya</span>
</label>
<a class="font-label-md text-label-md text-success hover:text-primary-pressed transition-colors focus:outline-none" href="#">
            Lupa password?
          </a>
</div>
<!-- Primary Action Button -->
<div class="pt-2">
<button class="w-full bg-success hover:bg-primary-pressed active:bg-primary-pressed text-on-primary font-label-md text-label-md py-3 px-5 rounded-xl transition-all shadow-sm flex items-center justify-center space-x-2 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-success font-semibold" type="submit">
<span>Masuk</span>
</button>
</div>
</form>
<!-- Bottom Register Link -->
<div class="mt-6 text-center">
<p class="font-body-md text-body-md text-on-surface-muted">
          Belum punya akun? 
          <a class="font-label-md text-label-md text-success hover:text-primary-pressed transition-colors ml-1 font-semibold" href="./s7_register_register.html">
            Daftar Sekarang
          </a>
</p>
</div>
</div>
</div>
</div>
<script>
  (function() {
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('password');
    const passwordEyeIcon = document.getElementById('passwordEyeIcon');

    if (togglePasswordBtn && passwordInput && passwordEyeIcon) {
      togglePasswordBtn.addEventListener('click', function() {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        passwordEyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  })();
</script></main><script src="./nav.js"></script>
</body></html>
