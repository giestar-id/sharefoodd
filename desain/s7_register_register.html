,full:"9999px"},spacing:{"space-xs":"0.25rem",sm:"8px","space-xl":"2rem",gutter:"16px",xl:"32px","space-lg":"1.5rem",margin:"20px",md:"16px",lg:"24px","space-sm":"0.5rem",xs:"4px","space-md":"1rem"},fontFamily:{"body-md":["Montserrat"],caption:["Montserrat"],"title-md":["Montserrat"],"headline-lg":["Montserrat"],"headline-lg-mobile":["Montserrat"],"label-md":["Montserrat"]},fontSize:{"body-md":["14px",{lineHeight:"1.5",letterSpacing:"0em",fontWeight:"400"}],caption:["12px",{lineHeight:"1.35",letterSpacing:"0.01em",fontWeight:"500"}],"title-md":["18px",{lineHeight:"1.35",letterSpacing:"-0.01em",fontWeight:"600"}],"headline-lg":["28px",{lineHeight:"1.25",letterSpacing:"-0.02em",fontWeight:"700"}],"headline-lg-mobile":["24px",{lineHeight:"30px",letterSpacing:"-0.02em",fontWeight:"700"}],"label-md":["13px",{lineHeight:"1.2",letterSpacing:"0em",fontWeight:"600"}]}}}}</script></head><body class="bg-background font-body-md text-on-surface antialiased min-h-screen flex items-center justify-center"><main class="w-full min-h-screen flex items-center justify-center p-4 sm:p-6"><div class="flex flex-col w-full items-center justify-center py-6 px-4">
<div class="w-full max-w-[440px] bg-surface rounded-[20px] p-6 sm:p-8 shadow-sm relative overflow-hidden transition-all duration-300 border border-outline">
<div class="absolute -top-16 -right-16 w-36 h-36 bg-surface-container rounded-full blur-2xl pointer-events-none opacity-60"></div>
<div class="absolute -bottom-16 -left-16 w-36 h-36 bg-secondary-fixed rounded-full blur-2xl pointer-events-none opacity-40"></div>
<div class="relative z-10 flex flex-col items-center">
<a href="./s1_beranda.html" class="inline-flex items-center gap-1 text-caption font-caption text-on-surface-muted hover:text-primary transition-colors mb-4 self-start font-medium">
<span class="material-symbols-outlined text-[16px]">arrow_back</span>
<span>Kembali ke Beranda</span>
</a>
<div class="w-12 h-12 rounded-xl bg-badge-bg flex items-center justify-center text-primary-container shadow-sm mb-1">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">eco</span>
</div>
<div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-surface-container-low text-primary text-caption font-caption mb-2">
<span class="w-1.5 h-1.5 rounded-full bg-success"></span>
        Komunitas Berbagi Pangan
      </div>
<h1 class="text-2xl sm:text-headline-lg-mobile text-scrim text-center tracking-tight font-bold">
        Buat Akun ShareFood
      </h1>
<p class="font-body-md text-body-md text-on-surface-muted text-center mt-1.5 mb-6 max-w-[320px]">
        Satu akun untuk berbagi dan mengambil makanan secara sukarela.
      </p>
<form class="w-full flex flex-col gap-4" id="registerForm" onsubmit="event.preventDefault(); window.location.href='./s11_dashboard_ringkasan_dashboard.html';">
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface flex items-center justify-between" for="fullName">
            Nama Lengkap
          </label>
<div class="relative">
<input class="w-full bg-background rounded-xl px-3.5 py-2.5 font-body-md text-body-md text-on-surface placeholder:text-on-surface-muted/60 transition-colors duration-150 focus:outline-none focus:bg-surface shadow-[inset_0_0_0_1px_#E3EAE5] focus:shadow-[inset_0_0_0_1.5px_#23865B]" id="fullName" placeholder="Contoh: Siti Rahma" required="" type="text"/>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface flex items-center justify-between" for="email">
            Email
          </label>
<div class="relative">
<input class="w-full bg-background rounded-xl px-3.5 py-2.5 font-body-md text-body-md text-on-surface placeholder:text-on-surface-muted/60 transition-colors duration-150 focus:outline-none focus:bg-surface shadow-[inset_0_0_0_1px_#E3EAE5] focus:shadow-[inset_0_0_0_1.5px_#23865B]" id="email" placeholder="siti@email.com" required="" type="email"/>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface flex items-center justify-between" for="password">
            Password
          </label>
<div class="relative flex items-center">
<input class="w-full bg-background rounded-xl pl-3.5 pr-10 py-2.5 font-body-md text-body-md text-on-surface placeholder:text-on-surface-muted/60 transition-colors duration-150 focus:outline-none focus:bg-surface shadow-[inset_0_0_0_1px_#E3EAE5] focus:shadow-[inset_0_0_0_1.5px_#23865B]" id="password" minlength="8" placeholder="Minimal 8 karakter" required="" type="password"/>
<button aria-label="Tampilkan atau sembunyikan sandi" class="absolute right-3 text-on-surface-muted hover:text-on-surface p-0.5 rounded focus:outline-none transition-colors" onclick="togglePasswordVisibility('password', 'passwordToggleIcon')" type="button">
<span class="material-symbols-outlined text-[19px]" id="passwordToggleIcon">visibility</span>
</button>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface flex items-center justify-between" for="confirmPassword">
            Konfirmasi Password
          </label>
<div class="relative flex items-center">
<input class="w-full bg-background rounded-xl pl-3.5 pr-10 py-2.5 font-body-md text-body-md text-on-surface placeholder:text-on-surface-muted/60 transition-colors duration-150 focus:outline-none focus:bg-surface shadow-[inset_0_0_0_1px_#E3EAE5] focus:shadow-[inset_0_0_0_1.5px_#23865B]" id="confirmPassword" minlength="8" placeholder="Ulangi password" required="" type="password"/>
<button aria-label="Tampilkan atau sembunyikan konfirmasi sandi" class="absolute right-3 text-on-surface-muted hover:text-on-surface p-0.5 rounded focus:outline-none transition-colors" onclick="togglePasswordVisibility('confirmPassword', 'confirmToggleIcon')" type="button">
<span class="material-symbols-outlined text-[19px]" id="confirmToggleIcon">visibility</span>
</button>
</div>
</div>
<div class="flex items-start gap-2.5 pt-1">
<div class="relative flex items-center pt-0.5">
<input class="peer appearance-none w-4 h-4 rounded bg-background shadow-[inset_0_0_0_1px_#E3EAE5] checked:bg-success checked:shadow-none focus:outline-none cursor-pointer transition-all" id="termsAgreement" required="" type="checkbox"/>
<span class="material-symbols-outlined absolute text-[14px] text-on-primary pointer-events-none opacity-0 peer-checked:opacity-100 left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 font-bold transition-opacity">
              check
            </span>
</div>
<label class="font-caption text-caption text-on-surface-muted leading-tight cursor-pointer select-none" for="termsAgreement">
            Saya menyetujui <a class="text-primary font-medium hover:underline" href="#">Panduan Komunitas</a> &amp; <a class="text-primary font-medium hover:underline" href="#">Kebijakan Privasi</a> ShareFood
          </label>
</div>
<button class="w-full mt-2 py-3 px-5 rounded-xl bg-success text-on-primary font-label-md text-label-md font-semibold tracking-wide hover:bg-primary-pressed active:bg-primary-pressed transition-colors duration-150 flex items-center justify-center gap-2 shadow-sm" id="submitBtn" type="submit">
<span>Buat Akun</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<div class="mt-6 flex items-center justify-center gap-1.5 font-body-md text-body-md text-on-surface-muted">
<span>Sudah punya akun?</span>
<a class="font-label-md text-label-md font-semibold text-success hover:underline" href="./s6_login_login.html">Masuk di sini</a>
</div>
</div>
</div>
<div class="mt-6 flex items-center gap-6 text-caption font-caption text-on-surface-muted">
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-[16px] text-success">lock</span>
<span>Enkripsi Aman</span>
</div>
<div class="w-1 h-1 rounded-full bg-outline-variant"></div>
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-[16px] text-success">volunteer_activism</span>
<span>Bebas Biaya 100%</span>
</div>
</div>
</div>
<script>
  function togglePasswordVisibility(fieldId, iconId) {
    const field = document.getElementById(fieldId);
    const icon = document.getElementById(iconId);
    if (!field || !icon) return;
    
    if (field.type === 'password') {
      field.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      field.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function handleRegistration() {
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const btn = document.getElementById('submitBtn');

    if (password !== confirmPassword) {
      alert('Konfirmasi password tidak cocok dengan password yang dimasukkan.');
      return;
    }

    const originalContent = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span><span>Memproses...</span>';

    setTimeout(() => {
      btn.innerHTML = '<span class="material-symbols-outlined text-[18px]">check_circle</span><span>Pendaftaran Berhasil</span>';
      btn.classList.remove('bg-success');
      btn.classList.add('bg-primary-pressed');
    }, 900);
  }
</script></main><script src="./nav.js"></script>
</body></html>
